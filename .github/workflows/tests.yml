name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Lint PHP
        run: find src routes database -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: node --check resources/assets/topology.js

  ansible:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Lint PHP
        run: find src routes database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: node --check resources/assets/ansible.js
      - name: Inventory script
        run: |
          python3 -m py_compile contrib/librenms_inventory.py
          python3 -m unittest discover -s contrib/tests -v

  compliance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.5 too: LibreNMS runs on it, and the tests fail on the plugin's deprecations (phpunit.xml.dist)
        php: ['8.2', '8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: compliance
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Lint PHP
        run: find src routes database tests -name '*.php' -print0 | xargs -0 -n1 php -l
