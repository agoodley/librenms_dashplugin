! Command: show running-config
! device: leaf1 (DCS-7050SX3-48YC8, EOS-4.28.3M)
!
! boot system flash:/EOS-4.28.3M.swi
!
transceiver qsfp default-mode 4x10G
!
hostname leaf1
!
spanning-tree mode mstp
spanning-tree edge-port bpduguard default
!
aaa authentication login default local
!
username admin privilege 15 role network-admin secret sha512 $6$abc$defghijklmnopqrstuvwxyz
!
interface Ethernet1
   description server1
   switchport access vlan 10
!
interface Ethernet2
   description server2 (auto edge off)
   no spanning-tree portfast auto
!
interface Ethernet3
   description to spine1
   switchport mode trunk
!
interface Ethernet4
   description to leaf2 (peer)
   switchport mode trunk
   spanning-tree portfast
!
interface Management1
   ip address 192.168.1.20/24
!
management telnet
   no shutdown
!
banner login
Unauthorized access is prohibited
logging host 192.0.2.99
!
EOF
!
end
